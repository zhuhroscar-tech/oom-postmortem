[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oom-postmortem"
version = "0.1.0"
description = "Determine which of several distinct OOM mechanisms killed a process: kernel OOM killer, systemd-oomd, or cgroup memory-limit kill."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "zhuhroscar-tech"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
oom-postmortem = "oom_postmortem.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
