name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: python -m pip install -e . pytest
      - name: Run unit tests
        run: python -m pytest -v
      - name: Smoke-test against real journal/cgroupfs on this Linux runner
        run: |
          oom-postmortem --version
          oom-postmortem --help
          sudo "$(command -v oom-postmortem)" --json > /tmp/report.json || true
          python -m json.tool < /tmp/report.json
          sudo "$(command -v oom-postmortem)" --since "10 minutes ago" || true

  build-artifact:
    name: Build .pyz + sdist/wheel and smoke-test on Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install build
          python -m build
      - name: Build a standalone .pyz (zipapp)
        run: |
          python -m pip install . --target build/pyz_root
          printf 'from oom_postmortem.cli import main\nif __name__ == "__main__":\n    raise SystemExit(main())\n' > build/pyz_root/__main__.py
          python -m zipapp build/pyz_root \
            --output dist/oom-postmortem.pyz \
            --python "/usr/bin/env python3"
      - name: Smoke-test the .pyz on this Linux runner
        run: |
          python3 dist/oom-postmortem.pyz --version
          sudo python3 dist/oom-postmortem.pyz --json > /tmp/op.json || true
          python3 -m json.tool < /tmp/op.json > /dev/null
          # Regression check: the .pyz's exit code must reflect the real
          # command result, not always be 0 (zipapp's --main template
          # omits sys.exit(), which previously made every .pyz invocation
          # report success regardless of actual findings/errors). An
          # unrecognized flag is a deterministic nonzero (argparse error) case.
          set +e
          python3 dist/oom-postmortem.pyz --bogus-flag-xyz > /dev/null 2>&1
          bogus_code=$?
          set -e
          test "$bogus_code" -ne 0
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
